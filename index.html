<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>115資優班新生三人以下分組</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #64748b;
      --line: #d7dde8;
      --paper: #fbfcff;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-2: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(15,118,110,.10), rgba(180,83,9,.08)),
        var(--paper);
    }
    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      border-bottom: 2px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    button, select {
      height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 15px;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      padding: 12px;
      border-radius: 8px;
    }
    .stat b {
      display: block;
      font-size: 24px;
      margin-bottom: 3px;
    }
    .stat span { color: var(--muted); font-size: 14px; }
    .groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .group {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      min-height: 170px;
    }
    .group-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 11px;
      background: #eef6f4;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }
    .group-title span:last-child {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .student {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 11px;
      border-bottom: 1px dashed var(--line);
      align-items: center;
    }
    .student.status-new { background: #ecfdf5; }
    .student.status-old { background: #fff7ed; }
    .student:last-child { border-bottom: 0; }
    .name { font-size: 22px; font-weight: 800; }
    .tag {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }
    .empty {
      border: 1px dashed var(--line);
      background: rgba(255,255,255,.72);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }
    .list {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .chip {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 14px;
    }
    .chip.status-new {
      background: #dcfce7;
      border-color: #86efac;
      color: #14532d;
    }
    .chip.status-old {
      background: #ffedd5;
      border-color: #fdba74;
      color: #7c2d12;
    }
    @media print {
      body { background: white; }
      main { width: 100%; padding: 0; }
      header, .stats, .list { display: none; }
      .groups { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .group { break-inside: avoid; min-height: 0; }
      .name { font-size: 18px; }
      .student { padding: 7px 9px; }
    }
    @media (max-width: 760px) {
      header { align-items: stretch; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 24px; }
    }
  </style>
</head>

        <div class="sub">請依現場需求分別按「三年級新生分組」或「五年級名單分組」，每組最多 3 人。</div>

      <div class="stat"><b id="creative5">0</b><span>五年級分組名單</span></div>
      <div class="stat"><b id="groupRule">≤3</b><span>每組人數</span></div>

    <section id="groups" class="groups">

    </section>

    <section class="list">

      <div id="chips" class="chips"></div>

  </main>

];
    const groupsEl = document.getElementById("groups");
    const chipsEl = document.getElementById("chips");
    let lastGroups = [];
    let grade3Groups = [];
    let grade5Groups = [];
    const oldStudentNames = new Set([
      "林侑澄",
      "李依珊",
      "王思元",
      "黃苡喬",
      "簡嘉辰",
      "連永真",
      "郭柏妤",
      "陳品睿",
      "陳約翰",
      "劉勝心",
      "邱郅崴",
      "石蕓禎"
    ]);

    function studentStatus(student) {
      return oldStudentNames.has(student.name) ? "舊生" : "新生";
    }

    function shuffle(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function chunkUpToThree(items) {
      const groups = [];
      let i = 0;
      while (i < items.length) {
        const remaining = items.length - i;
        const size = remaining === 4 ? 2 : Math.min(3, remaining);
        groups.push(items.slice(i, i + size));
        i += size;
      }
      return groups;
    }

    function chunkGrade5WithNewStudent(items) {
      const newStudents = shuffle(items.filter(s => studentStatus(s) === "新生"));
      const oldStudents = shuffle(items.filter(s => studentStatus(s) === "舊生"));
      const groupCount = Math.ceil(items.length / 3);
      if (newStudents.length < groupCount) {
        alert("五年級新生人數不足，無法讓每組都有新生。");
        return chunkUpToThree(shuffle(items));
      }

      const groups = newStudents.slice(0, groupCount).map(student => [student]);
      const remaining = shuffle([...newStudents.slice(groupCount), ...oldStudents]);
      const slots = shuffle(groups.flatMap((_, index) => [index, index]));

      remaining.forEach(student => {
        const slotIndex = slots.findIndex(index => groups[index].length < 3);
        if (slotIndex === -1) return;
        const groupIndex = slots.splice(slotIndex, 1)[0];
        groups[groupIndex].push(student);
      });

      return shuffle(groups);
    }

    function drawList(list, prefix) {
      const groupedMembers = prefix.startsWith("五年級")
        ? chunkGrade5WithNewStudent(list)
        : chunkUpToThree(shuffle(list));
      const groups = groupedMembers.map((members, i) => ({ label: `${prefix}第 ${i + 1} 組`, members }));
      lastGroups = groups;
      if (prefix.startsWith("三年級")) grade3Groups = groups;
      if (prefix.startsWith("五年級")) grade5Groups = groups;
      renderGroups();
    }

    function drawGrade(grade, label) {
      const list = students.filter(s => s.category === "創造力" && s.grade === grade);
      renderChips(list);
      drawList(list, label);
    }

    function renderChips(list) {
      chipsEl.innerHTML = list.map(s => {
        const status = studentStatus(s);
        const statusClass = status === "新生" ? "status-new" : "status-old";
        return `<span class="chip ${statusClass}">${s.name}｜${s.category}｜${s.grade}｜${status}</span>`;
      }).join("");
    }

    function renderGroups() {
      groupsEl.innerHTML = "";
      if (!lastGroups.length) {
        groupsEl.innerHTML = '<div class="empty">尚未分組。請按「三年級新生分組」或「五年級名單分組」。</div>';
        return;
      }
      lastGroups.forEach((group, index) => {
        const card = document.createElement("article");
        card.className = "group";
        const title = document.createElement("div");
        title.className = "group-title";
        title.innerHTML = `<span>${group.label || `第 ${index + 1} 組`}</span><span>${group.members.length} 人</span>`;
        card.appendChild(title);
        group.members.forEach(student => {
          const row = document.createElement("div");
          const status = studentStatus(student);
          row.className = `student ${status === "新生" ? "status-new" : "status-old"}`;
          row.innerHTML = `<div class="name">${student.name}</div><div class="tag">${student.category}<br>${student.grade}<br>${status}</div>`;
          card.appendChild(row);
        });
        groupsEl.appendChild(card);
      });
    }

    function copyResult() {
      if (!lastGroups.length) return;
      const now = new Date();
      const stamp = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const heading = lastGroups[0]?.label?.startsWith("三年級") ? "三年級新生分組結果"
        : lastGroups[0]?.label?.startsWith("五年級") ? "五年級名單分組結果"
        : "新生分組結果";
      const totalPeople = lastGroups.reduce((sum, group) => sum + group.members.length, 0);
      const text = lastGroups.map((group, i) => {
        const title = group.label || `第 ${i + 1} 組`;
        const members = group.members.map(s => `${s.name}（${studentStatus(s)}）`).join("　");
        return `${title}（${group.members.length}人）\n${members}`;
      }).join("\n\n");
      const output = `${heading}\n產生時間：${stamp}\n共 ${lastGroups.length} 組，${totalPeople} 人\n\n${text}`;
      navigator.clipboard?.writeText(output);
    }

    function resetGroups() {
      lastGroups = [];
      grade3Groups = [];
      grade5Groups = [];
      renderChips(students);
      renderGroups();
    }

    function printWhenReady() {
      if (!grade3Groups.length || !grade5Groups.length) {
        const missing = [];
        if (!grade3Groups.length) missing.push("三年級新生分組");
        if (!grade5Groups.length) missing.push("五年級名單分組");
        alert(`請先完成：${missing.join("、")}，再列印。`);
        return;
      }
      lastGroups = [...grade3Groups, ...grade5Groups];
      renderGroups();
      window.print();
    }

    function init() {
      document.getElementById("totalCount").textContent = students.filter(s => studentStatus(s) === "新生").length;
      document.getElementById("creative3").textContent = students.filter(s => s.category === "創造力" && s.grade === "二升三").length;
      document.getElementById("creative5").textContent = students.filter(s => s.category === "創造力" && s.grade === "四升五").length;
      renderChips(students);
      document.getElementById("drawGrade3Btn").addEventListener("click", () => drawGrade("二升三", "三年級新生"));
      document.getElementById("drawGrade5Btn").addEventListener("click", () => drawGrade("四升五", "五年級名單"));
      document.getElementById("resetBtn").addEventListener("click", resetGroups);
      document.getElementById("copyBtn").addEventListener("click", copyResult);
      document.getElementById("printBtn").addEventListener("click", printWhenReady);
    }
